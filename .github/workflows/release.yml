name: Release APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: watt-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable signing key
        env:
          CHARGING_POWER_SIGNING_BUNDLE: ${{ secrets.CHARGING_POWER_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$CHARGING_POWER_SIGNING_BUNDLE" || { echo "::error::Repository secret CHARGING_POWER_SIGNING_BUNDLE is missing"; exit 1; }
          SIGN_DIR="$RUNNER_TEMP/charging-power-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$CHARGING_POWER_SIGNING_BUNDLE" | base64 --decode > "$SIGN_DIR/signing.zip"
          unzip -q "$SIGN_DIR/signing.zip" -d "$SIGN_DIR"
          CREDENTIALS="$SIGN_DIR/bgdata-signing/CREDENTIALS.txt"
          test -f "$CREDENTIALS" || { echo "::error::CREDENTIALS.txt not found in signing bundle"; exit 1; }

          KEYSTORE_PATH=""
          KEY_ALIAS=""
          KEYSTORE_PASSWORD=""
          KEY_PASSWORD=""
          KEYSTORE_FILE=""
          while IFS='=' read -r key value; do
            case "$key" in
              KEYSTORE_FILE) KEYSTORE_FILE="$value" ;;
              KEY_ALIAS) KEY_ALIAS="$value" ;;
              KEYSTORE_PASSWORD) KEYSTORE_PASSWORD="$value" ;;
              KEY_PASSWORD) KEY_PASSWORD="$value" ;;
            esac
          done < "$CREDENTIALS"

          test -n "$KEYSTORE_FILE" || { echo "::error::KEYSTORE_FILE is missing from CREDENTIALS.txt"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS is missing from CREDENTIALS.txt"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD is missing from CREDENTIALS.txt"; exit 1; }
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          KEYSTORE_PATH="$SIGN_DIR/bgdata-signing/$KEYSTORE_FILE"
          test -s "$KEYSTORE_PATH" || { echo "::error::Keystore file missing or empty"; exit 1; }

          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Watt ${{ steps.version.outputs.name }}
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
